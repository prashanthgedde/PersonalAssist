[project]
name = "personalassist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckduckgo-search>=8.1.1",
    "openai>=2.24.0",
    "python-dotenv>=1.2.2",
    "python-telegram-bot[webhooks]>=22.6",
    "yfinance>=0.2.0",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.0",
    "tavily-python>=0.5.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "schemas*"]
exclude = ["legacy*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
