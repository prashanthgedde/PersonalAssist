[project]
name = "personalassist"
version = "0.1.0"
description = "Personal AI assistant with web search, stock lookup, and weather tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckduckgo-search>=8.1.1",
    "openai>=2.24.0",
    "python-dotenv>=1.2.2",
    "python-telegram-bot[webhooks]>=22.6",
    "yfinance>=0.2.0",
    "requests>=2.32.0",
    "sqlalchemy>=2.0.0",
    "tavily-python>=0.7.23",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8.0",
    "pyright>=1.1.0",
    "pytest-mock>=3.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "memory*"]
exclude = ["legacy*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["legacy/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pyright]
include = ["agent", "tests"]
exclude = [
    "legacy",
    "agent/simple_agent.py",
    "agent/multi_turn_agent.py",
    "**/__pycache__",
]
pythonVersion = "3.10"
typeCheckingMode = "off"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.7",
]
